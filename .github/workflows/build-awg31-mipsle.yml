
name: Build AmneziaWG 3.1 for Keenetic MIPSel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Chur Keenetic
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false

      - name: Select AmneziaWG Go 3.1
        run: |
          set -euo pipefail

          git -C third_party/amneziawg-go fetch --tags --force
          git -C third_party/amneziawg-go checkout --detach v3.1.20260828

          GO_COMMIT="$(git -C third_party/amneziawg-go rev-parse HEAD)"
          echo "AMNEZIAWG_GO_COMMIT=$GO_COMMIT" >> "$GITHUB_ENV"

          echo "Selected Go commit: $GO_COMMIT"

      - name: Select AmneziaWG Tools 3.1
        run: |
          set -euo pipefail

          git clone --depth 1 --branch v3.1.20260812 \
            https://github.com/amnezia-vpn/amneziawg-tools.git \
            /tmp/awg-tools

          TOOLS_COMMIT="$(git -C /tmp/awg-tools rev-parse HEAD)"

          curl --fail --location --retry 3 \
            "https://github.com/amnezia-vpn/amneziawg-tools/archive/${TOOLS_COMMIT}.tar.gz" \
            --output /tmp/awg-tools.tar.gz

          TOOLS_SHA256="$(sha256sum /tmp/awg-tools.tar.gz | awk '{print $1}')"

          echo "AMNEZIAWG_TOOLS_COMMIT=$TOOLS_COMMIT" >> "$GITHUB_ENV"
          echo "AMNEZIAWG_TOOLS_SHA256=$TOOLS_SHA256" >> "$GITHUB_ENV"

      - name: Update package version
        run: |
          set -euo pipefail

          sed -i 's/^PKG_VERSION:=.*/PKG_VERSION:=3.1.20260812/' \
            packaging/entware/chur-amneziawg-tools/Makefile

          sed -i 's/^PKG_RELEASE:=.*/PKG_RELEASE:=1/' \
            packaging/entware/chur-amneziawg-tools/Makefile

      - name: Build Chur binaries
        run: |
          set -euo pipefail

          make AMNEZIAWG_GO_COMMIT="$AMNEZIAWG_GO_COMMIT" build_all

          make AMNEZIAWG_GO_COMMIT="$AMNEZIAWG_GO_COMMIT" \
            build_runtime_amneziawg_go_entware_mipsel-3.4

      - name: Verify MIPSel binaries
        run: |
          set -euo pipefail

          CHUR_VERSION="$(cat VERSION)"
          GO_SHORT_COMMIT="${AMNEZIAWG_GO_COMMIT:0:7}"

          MANAGER="dist/chur_${CHUR_VERSION}_entware_mipsel-3.4"
          AWG_GO="dist/amneziawg-go_${GO_SHORT_COMMIT}_entware_mipsel-3.4"

          test -x "$MANAGER"
          test -x "$AWG_GO"

          file "$MANAGER"
          file "$AWG_GO"

          readelf -h "$MANAGER"
          readelf -h "$AWG_GO"

      - name: Build Entware Docker image
        run: |
          set -euo pipefail

          docker build \
            -t chur-entware-build:20.04 \
            docker/entware-build

      - name: Checkout Entware source
        uses: actions/checkout@v4
        with:
          repository: Entware/Entware
          path: entware-src
          fetch-depth: 1

      - name: Prepare Entware Docker volume
        run: |
          set -euo pipefail

          VOLUME="chur-entware-mipsel-3.4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "ENTWARE_DOCKER_VOLUME=$VOLUME" >> "$GITHUB_ENV"

          docker volume create "$VOLUME" >/dev/null

          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$VOLUME:/entware" \
            -v "$GITHUB_WORKSPACE/entware-src:/seed:ro" \
            chur-entware-build:20.04 \
            bash -lc '
              set -euo pipefail

              test -d /seed/.git

              cp -a /seed/. /entware/

              chown -R "$HOST_UID:$HOST_GID" /entware

              test -d /entware/.git

              echo "Entware source successfully prepared"
            '

      - name: Build MIPSel IPK packages
        run: |
          set -euo pipefail

          ENV_FILE=/dev/null \
          ENTWARE_TARGET_CONFIG=mipsel-3.4 \
          ENTWARE_DOCKER_VOLUME="$ENTWARE_DOCKER_VOLUME" \
          AMNEZIAWG_GO_COMMIT="$AMNEZIAWG_GO_COMMIT" \
          AMNEZIAWG_TOOLS_COMMIT="$AMNEZIAWG_TOOLS_COMMIT" \
          AMNEZIAWG_TOOLS_SHA256="$AMNEZIAWG_TOOLS_SHA256" \
          make entware_build_ipk_volume

      - name: Verify packages
        run: |
          set -euo pipefail

          echo "Generated packages:"

          find dist/entware-ipk -maxdepth 1 -type f -name '*.ipk' -print

          test -n "$(find dist/entware-ipk -maxdepth 1 -type f -name '*chur-amneziawg-go*.ipk' -print -quit)"

          test -n "$(find dist/entware-ipk -maxdepth 1 -type f -name '*chur-amneziawg-tools*.ipk' -print -quit)"

          test -n "$(find dist/entware-ipk -maxdepth 1 -type f -name '*chur-amneziawg_*.ipk' -print -quit)"

          test -n "$(find dist/entware-ipk -maxdepth 1 -type f -name '*chur-keenetic*.ipk' -print -quit)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awg31-keenetic-mipsel-3.4
          path: dist/entware-ipk/*.ipk
          if-no-files-found: error
          retention-days: 14
