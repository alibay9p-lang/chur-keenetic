name: Build AmneziaWG 3.1 for Keenetic MIPSel

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Chur Keenetic source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Chur source files
        shell: bash
        run: |
          set -euo pipefail
          echo "Chur source commit: $(git rev-parse HEAD)"

          # Only files owned by the Chur repository belong in this check.
          # configs/mipsel-3.4.config is in the separate Entware checkout.
          required_files=(
            VERSION
            Makefile
            scripts/entware-build-volume.sh
            scripts/entware-prepare-tree.sh
            packaging/entware/chur-amneziawg-tools/Makefile
          )

          for path in "${required_files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "ERROR: missing Chur source file: $path" >&2
              exit 1
            fi
            echo "OK: $path"
          done

          if ! git -C third_party/amneziawg-go rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "ERROR: amneziawg-go submodule is not initialized" >&2
            exit 1
          fi
          echo "OK: third_party/amneziawg-go submodule"

          mkdir -p dist dist/entware-ipk

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: Select and verify AmneziaWG Go 3.1
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_GO_COMMIT="b5928efb6ca19f0153958460c3d141f04abc5c2e"
          git -C third_party/amneziawg-go fetch --tags --force

          TAG_COMMIT="$(git -C third_party/amneziawg-go rev-parse 'v3.1.20260828^{commit}')"
          if [[ "$TAG_COMMIT" != "$EXPECTED_GO_COMMIT" ]]; then
            echo "ERROR: Go tag commit mismatch: $TAG_COMMIT" >&2
            exit 1
          fi

          git -C third_party/amneziawg-go checkout --detach "$EXPECTED_GO_COMMIT"
          ACTUAL_GO_COMMIT="$(git -C third_party/amneziawg-go rev-parse HEAD)"
          [[ "$ACTUAL_GO_COMMIT" == "$EXPECTED_GO_COMMIT" ]]

          echo "AMNEZIAWG_GO_COMMIT=$ACTUAL_GO_COMMIT" >> "$GITHUB_ENV"
          echo "Verified AmneziaWG Go v3.1.20260828: $ACTUAL_GO_COMMIT"

      - name: Download and verify AmneziaWG Tools 3.1 source
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_TOOLS_COMMIT="ee0f0a9aa34ff0a0da4b3433b9512781cfe02843"
          EXPECTED_TOOLS_SHA256="22438f231d39ea27e4bdc69707ec3103357f3cecc9ad3eecba18a61e5b39c9b9"

          git clone --depth 1 --branch v3.1.20260812 \
            https://github.com/amnezia-vpn/amneziawg-tools.git \
            /tmp/awg-tools

          ACTUAL_TOOLS_COMMIT="$(git -C /tmp/awg-tools rev-parse HEAD)"
          if [[ "$ACTUAL_TOOLS_COMMIT" != "$EXPECTED_TOOLS_COMMIT" ]]; then
            echo "ERROR: Tools tag commit mismatch: $ACTUAL_TOOLS_COMMIT" >&2
            exit 1
          fi

          curl --fail --location --retry 3 \
            "https://github.com/amnezia-vpn/amneziawg-tools/archive/${ACTUAL_TOOLS_COMMIT}.tar.gz" \
            --output "dist/${ACTUAL_TOOLS_COMMIT}.tar.gz"

          echo "${EXPECTED_TOOLS_SHA256}  dist/${ACTUAL_TOOLS_COMMIT}.tar.gz" \
            | sha256sum --check

          echo "AMNEZIAWG_TOOLS_COMMIT=$ACTUAL_TOOLS_COMMIT" >> "$GITHUB_ENV"
          echo "AMNEZIAWG_TOOLS_SHA256=$EXPECTED_TOOLS_SHA256" >> "$GITHUB_ENV"

      - name: Pin AmneziaWG Tools package recipe
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("packaging/entware/chur-amneziawg-tools/Makefile")
          text = path.read_text()

          replacements = {
              r"^CHUR_AMNEZIAWG_TOOLS_COMMIT\?=.*$":
                  "CHUR_AMNEZIAWG_TOOLS_COMMIT?=ee0f0a9aa34ff0a0da4b3433b9512781cfe02843",
              r"^CHUR_AMNEZIAWG_TOOLS_SHA256\?=.*$":
                  "CHUR_AMNEZIAWG_TOOLS_SHA256?=22438f231d39ea27e4bdc69707ec3103357f3cecc9ad3eecba18a61e5b39c9b9",
              r"^PKG_VERSION:=.*$": "PKG_VERSION:=3.1.20260812",
              r"^PKG_RELEASE:=.*$": "PKG_RELEASE:=1",
          }

          for pattern, replacement in replacements.items():
              text, count = re.subn(pattern, replacement, text, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one Makefile line for {pattern!r}; found {count}"
                  )

          path.write_text(text)

          expected = {
              "CHUR_AMNEZIAWG_TOOLS_COMMIT?=ee0f0a9aa34ff0a0da4b3433b9512781cfe02843",
              "CHUR_AMNEZIAWG_TOOLS_SHA256?=22438f231d39ea27e4bdc69707ec3103357f3cecc9ad3eecba18a61e5b39c9b9",
              "PKG_VERSION:=3.1.20260812",
              "PKG_RELEASE:=1",
          }
          actual = set(path.read_text().splitlines())
          if not expected.issubset(actual):
              raise SystemExit("Updated Tools Makefile does not match the pinned source")

          print("AmneziaWG Tools recipe pinned and verified.")
          PY

      - name: Build Chur binaries for MIPSel
        shell: bash
        run: |
          set -euo pipefail

          make AMNEZIAWG_GO_COMMIT="$AMNEZIAWG_GO_COMMIT" build_all
          make AMNEZIAWG_GO_COMMIT="$AMNEZIAWG_GO_COMMIT" \
            build_runtime_amneziawg_go_entware_mipsel-3.4

      - name: Verify Chur MIPSel binaries
        shell: bash
        run: |
          set -euo pipefail

          CHUR_VERSION="$(cat VERSION)"
          GO_SHORT_COMMIT="${AMNEZIAWG_GO_COMMIT:0:7}"
          MANAGER="dist/chur_${CHUR_VERSION}_entware_mipsel-3.4"
          AWG_GO="dist/amneziawg-go_${GO_SHORT_COMMIT}_entware_mipsel-3.4"

          for binary in "$MANAGER" "$AWG_GO"; do
            if [[ ! -x "$binary" ]]; then
              echo "ERROR: expected executable missing: $binary" >&2
              exit 1
            fi

            header="$(readelf -h "$binary")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Fq 'little endian' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+MIPS' <<< "$header"
            echo "Verified ELF32 MIPS little-endian: $binary"
          done

          file "$MANAGER" "$AWG_GO"

      - name: Add GCC 10 and host development headers to Docker image
        shell: bash
        run: |
          set -euo pipefail

          cat >> docker/entware-build/Dockerfile <<'DOCKER'

          RUN apt-get update \
           && apt-get install -y --no-install-recommends \
                gcc-10 \
                g++-10 \
                libc6-dev \
                libncurses-dev \
                gettext \
                libgettextpo-dev \
           && update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100 \
           && update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100 \
           && update-alternatives --set gcc /usr/bin/gcc-10 \
           && update-alternatives --set g++ /usr/bin/g++-10 \
           && gcc -dumpversion | grep -Eq '^10([.]|$)' \
           && g++ -dumpversion | grep -Eq '^10([.]|$)' \
           && test -f /usr/include/argp.h \
           && test -f /usr/include/fts.h \
           && test -f /usr/include/obstack.h \
           && test -f /usr/include/libintl.h \
           && test -f /usr/include/ncurses.h \
           && rm -rf /var/lib/apt/lists/*
          DOCKER

      - name: Build Entware Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build --no-cache -t chur-entware-build:20.04 docker/entware-build

      - name: Verify GCC 10 and host headers as build user
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm -i \
            -e HOST_UID=1001 \
            -e HOST_GID=1001 \
            chur-entware-build:20.04 bash -s <<'CONTAINER'
          set -euo pipefail

          if ! getent group "$HOST_GID" >/dev/null; then
            groupadd -g "$HOST_GID" churbuild
          fi

          if ! getent passwd "$HOST_UID" >/dev/null; then
            useradd -u "$HOST_UID" -g "$HOST_GID" \
              -M -d /tmp -s /bin/bash churbuild
          fi

          cat > /tmp/check-host-tools.sh <<'CHECK'
          #!/bin/bash
          set -euo pipefail
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          echo "Build user: $(id)"
          command -v gcc
          command -v g++

          gcc -dumpversion | grep -Eq '^10([.]|$)'
          g++ -dumpversion | grep -Eq '^10([.]|$)'

          printf '%s\n' \
            '#include <argp.h>' \
            '#include <fts.h>' \
            '#include <obstack.h>' \
            '#include <libintl.h>' \
            '#include <ncurses.h>' \
            'int main(void) { return 0; }' \
            | gcc -x c -o /tmp/chur-host-c-check -

          printf '%s\n' \
            '#include <ncurses.h>' \
            'int main(void) { initscr(); endwin(); return 0; }' \
            | gcc -x c -o /tmp/chur-ncurses-check - -lncurses

          printf '%s\n' \
            '#include <iostream>' \
            'int main() { return 0; }' \
            | g++ -x c++ -o /tmp/chur-host-cxx-check -

          echo "GCC/G++ compile and link tests plus host headers verified as churbuild."
          CHECK

          chmod 755 /tmp/check-host-tools.sh
          chown "$HOST_UID:$HOST_GID" /tmp/check-host-tools.sh
          su churbuild -s /bin/bash /tmp/check-host-tools.sh
          CONTAINER

      - name: Resolve Entware master to an immutable commit
        id: entware-ref
        shell: bash
        run: |
          set -euo pipefail

          ref_line="$(git ls-remote https://github.com/Entware/Entware.git refs/heads/master)"
          read -r commit ref_name <<< "$ref_line"

          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: could not resolve Entware master to a commit SHA" >&2
            exit 1
          fi
          if [[ "$ref_name" != "refs/heads/master" ]]; then
            echo "ERROR: unexpected Entware ref: $ref_name" >&2
            exit 1
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Entware commit pinned for this run: $commit"

      - name: Checkout pinned Entware source
        uses: actions/checkout@v4
        with:
          repository: Entware/Entware
          ref: ${{ steps.entware-ref.outputs.commit }}
          path: entware-src
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Entware source and MIPSel configuration
        shell: bash
        run: |
          set -euo pipefail

          expected="${{ steps.entware-ref.outputs.commit }}"
          actual="$(git -C entware-src rev-parse HEAD)"

          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: Entware source commit mismatch: $actual (expected $expected)" >&2
            exit 1
          fi

          # This config belongs to Entware/Entware, NOT to Chur/Keenetic.
          config="entware-src/configs/mipsel-3.4.config"
          if [[ ! -s "$config" ]]; then
            echo "ERROR: missing Entware MIPSel config: $config" >&2
            exit 1
          fi

          grep -Fxq 'CONFIG_TARGET_BOARD="mipsel-3.4"' "$config"
          grep -Fxq 'CONFIG_TARGET_ARCH_PACKAGES="mipsel-3.4"' "$config"

          echo "Verified Entware commit: $actual"
          echo "Verified Entware target config: $config"

      - name: Prepare Entware Docker volume
        shell: bash
        run: |
          set -euo pipefail

          VOLUME="chur-entware-mipsel-3.4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "ENTWARE_DOCKER_VOLUME=$VOLUME" >> "$GITHUB_ENV"

          docker volume create "$VOLUME" >/dev/null

          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$VOLUME:/entware" \
            -v "$GITHUB_WORKSPACE/entware-src:/seed:ro" \
            chur-entware-build:20.04 \
            bash -lc '
              set -euo pipefail
              test -d /seed/.git
              test -f /seed/configs/mipsel-3.4.config
              cp -a /seed/. /entware/
              chown -R "$HOST_UID:$HOST_GID" /entware
              test -d /entware/.git
              test -f /entware/configs/mipsel-3.4.config
              echo "Entware source prepared: $(git -C /entware rev-parse HEAD)"
            '

      - name: Patch Entware wrapper for GCC 10 and local Tools archive
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("scripts/entware-build-volume.sh")
          source = path.read_text()

          marker = "ENTWARE_DIR=/entware sh /src/scripts/entware-prepare-tree.sh\n"
          count = source.count(marker)
          if count != 2:
              raise SystemExit(
                  f"Expected exactly two prepare-tree commands in wrapper; found {count}"
              )

          commit = os.environ["AMNEZIAWG_TOOLS_COMMIT"]

          insertion = (
              marker
              + "export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\n"
              + "test -x /usr/bin/gcc\n"
              + "test -x /usr/bin/g++\n"
              + "mkdir -p /entware/staging_dir/host/bin /entware/dl\n"
              + "ln -sfn /usr/bin/gcc /entware/staging_dir/host/bin/gcc\n"
              + "ln -sfn /usr/bin/g++ /entware/staging_dir/host/bin/g++\n"
              + f'test -f "/src/dist/{commit}.tar.gz"\n'
              + f'cp -f "/src/dist/{commit}.tar.gz" "/entware/dl/{commit}.tar.gz"\n'
              + f'test -f "/entware/dl/{commit}.tar.gz"\n'
          )

          source = source.replace(marker, insertion)
          path.write_text(source)

          updated = path.read_text()
          for required in (
              "/usr/bin/gcc",
              "/usr/bin/g++",
              "/entware/staging_dir/host/bin/gcc",
              "/entware/staging_dir/host/bin/g++",
              f"/src/dist/{commit}.tar.gz",
              f"/entware/dl/{commit}.tar.gz",
          ):
              if required not in updated:
                  raise SystemExit(f"Wrapper patch verification failed: {required}")

          print("Wrapper patch applied at both known prepare-tree points.")
          PY

          sh -n scripts/entware-build-volume.sh

      - name: Build MIPSel IPK packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/entware-ipk

          ENTWARE_DOCKER_IMAGE="chur-entware-build:20.04" \
          ENV_FILE=/dev/null \
          ENTWARE_TARGET_CONFIG=mipsel-3.4 \
          ENTWARE_DOCKER_VOLUME="$ENTWARE_DOCKER_VOLUME" \
          AMNEZIAWG_GO_COMMIT="$AMNEZIAWG_GO_COMMIT" \
          AMNEZIAWG_TOOLS_COMMIT="$AMNEZIAWG_TOOLS_COMMIT" \
          AMNEZIAWG_TOOLS_SHA256="$AMNEZIAWG_TOOLS_SHA256" \
          sh -x scripts/entware-build-volume.sh 2>&1 | tee dist/entware-build.log

      - name: Preserve built IPK packages before verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: awg31-ipk-candidate-unverified
          path: dist/entware-ipk/*.ipk
          if-no-files-found: error
          retention-days: 7

      - name: Verify IPK metadata and AWG binaries
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from io import BytesIO
          import gzip
          import struct
          import tarfile

          root = Path("dist/entware-ipk")
          packages = sorted(root.glob("*.ipk"))
          if not packages:
              raise SystemExit("No IPK packages were generated")

          required = {
              "chur-amneziawg-go",
              "chur-amneziawg-tools",
              "chur-amneziawg",
              "chur-keenetic",
          }
          found = {}

          def normalized_member(name: str) -> str:
              # Entware ipkg-build writes archive members with a leading ./.
              parts = [
                  part for part in PurePosixPath(name).parts
                  if part not in ("/", ".", "")
              ]
              return "/".join(parts)

          def read_outer_ipk(package: Path) -> dict[str, bytes]:
              # Entware's ipkg-build creates a gzip-compressed tar archive,
              # not an ar archive. It contains debian-binary, data.tar.gz,
              # and control.tar.gz.
              try:
                  with tarfile.open(package, mode="r:gz") as archive:
                      result = {}
                      for name in ("debian-binary", "control.tar.gz", "data.tar.gz"):
                          matches = [
                              member for member in archive.getmembers()
                              if normalized_member(member.name) == name
                          ]
                          if len(matches) != 1:
                              raise SystemExit(
                                  f"{package.name}: expected exactly one {name}; "
                                  f"found {len(matches)}"
                              )
                          stream = archive.extractfile(matches[0])
                          if stream is None:
                              raise SystemExit(
                                  f"{package.name}: cannot read {name}"
                              )
                          result[name] = stream.read()
              except (tarfile.TarError, OSError, EOFError) as exc:
                  raise SystemExit(
                      f"{package.name}: not a valid Entware gzip-tar IPK: {exc}"
                  ) from exc

              if result["debian-binary"].strip() != b"2.0":
                  raise SystemExit(
                      f"{package.name}: unsupported debian-binary marker"
                  )
              return result

          def read_inner_file(blob: bytes, wanted: str, package: Path) -> bytes:
              try:
                  with tarfile.open(fileobj=BytesIO(blob), mode="r:gz") as archive:
                      matches = [
                          member for member in archive.getmembers()
                          if normalized_member(member.name) == wanted
                      ]
                      if len(matches) != 1:
                          raise SystemExit(
                              f"{package.name}: expected exactly one {wanted}; "
                              f"found {len(matches)}"
                          )
                      if not matches[0].isfile():
                          raise SystemExit(
                              f"{package.name}: {wanted} is not a regular file"
                          )
                      stream = archive.extractfile(matches[0])
                      if stream is None:
                          raise SystemExit(
                              f"{package.name}: cannot read {wanted}"
                          )
                      return stream.read()
              except (tarfile.TarError, OSError, EOFError) as exc:
                  raise SystemExit(
                      f"{package.name}: invalid compressed archive {wanted}: {exc}"
                  ) from exc

          def read_control(package: Path, outer: dict[str, bytes]) -> dict[str, str]:
              raw = read_inner_file(outer["control.tar.gz"], "control", package)
              text = raw.decode("utf-8")
              fields = {}
              for line in text.splitlines():
                  if line and not line[0].isspace() and ":" in line:
                      key, value = line.split(":", 1)
                      fields[key] = value.strip()
              return fields

          outer_archives = {}
          for package in packages:
              outer = read_outer_ipk(package)
              fields = read_control(package, outer)
              name = fields.get("Package", "")
              if name in required:
                  if name in found:
                      raise SystemExit(f"Duplicate IPK package: {name}")
                  found[name] = (package, fields)
                  outer_archives[name] = outer

          missing = required - found.keys()
          if missing:
              raise SystemExit(
                  f"Required IPK packages missing: {sorted(missing)}"
              )

          for name, (package, fields) in sorted(found.items()):
              arch = fields.get("Architecture", "")
              if name == "chur-amneziawg":
                  if arch not in ("all", "mipsel-3.4"):
                      raise SystemExit(
                          f"Unexpected {name} architecture: {arch}"
                      )
              elif arch != "mipsel-3.4":
                  raise SystemExit(
                      f"Unexpected {name} architecture: {arch}"
                  )

              if not fields.get("Version"):
                  raise SystemExit(f"{package.name}: Version field missing")

              print(
                  f"{name}: version={fields['Version']} "
                  f"architecture={arch} file={package.name}"
              )

          tools_version = found["chur-amneziawg-tools"][1].get("Version", "")
          if tools_version != "3.1.20260812-1":
              raise SystemExit(
                  "Expected exact AWG Tools version 3.1.20260812-1, "
                  f"got {tools_version!r}"
              )

          go_version = found["chur-amneziawg-go"][1].get("Version", "")
          expected_go_version = "b5928ef-1"
          if go_version != expected_go_version:
              raise SystemExit(
                  f"Expected AWG Go package version {expected_go_version}, "
                  f"got {go_version!r}"
              )

          def read_data_files(package: Path, outer: dict[str, bytes]) -> dict[str, bytes]:
              blob = outer["data.tar.gz"]
              result = {}
              try:
                  with tarfile.open(fileobj=BytesIO(blob), mode="r:gz") as archive:
                      for member in archive.getmembers():
                          name = normalized_member(member.name)
                          if name in {
                              "opt/bin/amneziawg-go",
                              "opt/bin/awg",
                              "opt/bin/awg-quick",
                          }:
                              if not member.isfile():
                                  raise SystemExit(
                                      f"{package.name}: {name} is not a regular file"
                                  )
                              stream = archive.extractfile(member)
                              if stream is not None:
                                  if name in result:
                                      raise SystemExit(
                                          f"Duplicate package file: {name}"
                                      )
                                  result[name] = stream.read()
              except (tarfile.TarError, OSError, EOFError) as exc:
                  raise SystemExit(
                      f"{package.name}: invalid data.tar.gz: {exc}"
                  ) from exc
              return result

          go_files = read_data_files(
              found["chur-amneziawg-go"][0],
              outer_archives["chur-amneziawg-go"],
          )
          tools_files = read_data_files(
              found["chur-amneziawg-tools"][0],
              outer_archives["chur-amneziawg-tools"],
          )

          expected_go = "opt/bin/amneziawg-go"
          expected_awg = "opt/bin/awg"
          expected_quick = "opt/bin/awg-quick"

          for expected, archive_files in (
              (expected_go, go_files),
              (expected_awg, tools_files),
              (expected_quick, tools_files),
          ):
              if expected not in archive_files:
                  raise SystemExit(
                      f"Missing binary/script in IPK: {expected}"
                  )

          def verify_mipsel_elf(name: str, data: bytes) -> None:
              if len(data) < 52 or data[:4] != b"\x7fELF":
                  raise SystemExit(f"{name}: not a valid ELF executable")
              if data[4] != 1:
                  raise SystemExit(f"{name}: expected ELF32 (EI_CLASS=1)")
              if data[5] != 1:
                  raise SystemExit(
                      f"{name}: expected little-endian (EI_DATA=1)"
                  )
              if data[6] != 1:
                  raise SystemExit(f"{name}: unsupported ELF version")
              machine = struct.unpack_from("<H", data, 18)[0]
              if machine != 8:
                  raise SystemExit(
                      f"{name}: expected EM_MIPS (8), got {machine}"
                  )
              print(
                  f"Verified {name}: ELF32, little-endian, EM_MIPS"
              )

          verify_mipsel_elf("amneziawg-go", go_files[expected_go])
          verify_mipsel_elf("awg", tools_files[expected_awg])

          awg_quick_data = tools_files[expected_quick]
          if not awg_quick_data.startswith(b"#!"):
              raise SystemExit("awg-quick: missing interpreter shebang")
          if b"/opt/bin/bash" not in awg_quick_data.splitlines()[0]:
              raise SystemExit(
                  "awg-quick: expected Entware interpreter /opt/bin/bash"
              )

          print(
              "All four Entware IPK archives, package metadata, "
              "and both AWG ELF binaries verified."
          )
          PY

      - name: Upload MIPSel IPK packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: awg31-keenetic-mipsel-3.4
          path: dist/entware-ipk/*.ipk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awg31-build-diagnostics
          path: |
            dist/entware-build.log
            dist/*.tar.gz
          if-no-files-found: ignore
          retention-days: 7
