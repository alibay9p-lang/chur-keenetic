
name: Build AmneziaWG 3.1 for Keenetic MIPSel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-mipsel-linux-gnu \
            binutils-mipsel-linux-gnu \
            git \
            make

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Prepare output
        run: mkdir -p dist

      - name: Build AmneziaWG Go 3.1
        run: |
          git clone --depth 1 --branch v3.1.20260828 \
            https://github.com/amnezia-vpn/amneziawg-go.git awg-go

          cd awg-go

          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=mipsle \
          GOMIPS=softfloat \
          go build -trimpath \
            -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/dist/amneziawg-go" .

      - name: Build AmneziaWG Tools 3.1
        run: |
          git clone --depth 1 --branch v3.1.20260812 \
            https://github.com/amnezia-vpn/amneziawg-tools.git awg-tools

          make -C awg-tools/src \
            CC="mipsel-linux-gnu-gcc -mabi=32 -march=mips32r2 -msoft-float" \
            LDFLAGS="-static"

          install -m 755 awg-tools/src/wg dist/awg
          install -m 755 awg-tools/src/wg-quick/linux.bash dist/awg-quick

      - name: Verify binaries
        run: |
          file dist/*
          readelf -h dist/amneziawg-go
          readelf -h dist/awg

      - name: Create archive
        run: |
          tar -czf awg31-mipsel.tar.gz -C dist .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awg31-mipsel
          path: awg31-mipsel.tar.gz
          if-no-files-found: error
